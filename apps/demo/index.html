<!doctype html>
<html lang="en" data-theme="dark" data-startup="loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="pane-token" content="__PANE_TOKEN__" />
    <title>Pane System</title>
    <style>
      html[data-startup="loading"] body > :not(#startup-screen),
      html[data-startup="failed"] body > :not(#startup-screen) {
        visibility: hidden;
      }
      html,
      body {
        margin: 0;
        background: var(--startup-surface, #191a1b);
      }
    </style>
    <script src="/assets/startup.js"></script>
    <link rel="stylesheet" href="/assets/startup.css" />
    <link rel="stylesheet" href="/assets/demo.css" />
    <script type="module" src="/assets/demo.js"></script>
  </head>
  <body class="reference-workbench">
    <div id="startup-screen" role="status" aria-live="polite">
      <!-- Visual reference: https://beui.dev/components/motion/loader (Spinner). -->
      <span class="ux-spinner" aria-hidden="true">
        <svg
          class="ux-spinner__graphic"
          viewBox="0 0 32 32"
          fill="none"
          focusable="false"
        >
          <circle
            cx="16"
            cy="16"
            r="14.56"
            stroke="currentColor"
            stroke-width="2.88"
            opacity="0.2"
          ></circle>
          <path
            d="M16 1.44 A14.56 14.56 0 0 1 30.56 16"
            stroke="currentColor"
            stroke-width="2.88"
            stroke-linecap="round"
          ></path>
        </svg>
      </span>
      <p id="startup-message">Opening workspace</p>
      <button id="startup-retry" hidden>Reload</button>
    </div>
    <header class="app-header">
      <div class="project-name">
        <span id="active-file">Welcome</span> —
        <span id="workspace-name">workspace</span
        ><img src="/assets/logo.svg" alt="" width="16" height="16" />
      </div>
      <div class="window-actions">
        <button
          id="commands"
          title="Find a command (Command K)"
          aria-label="Find a command"
        ></button>
        <button
          id="toggle-files"
          title="Toggle files (Command B)"
          aria-label="Toggle files"
        ></button>
        <button
          id="split-editor"
          title="Split pane right"
          aria-label="Split pane right"
        ></button>
        <button
          id="theme"
          title="Change theme"
          aria-label="Change theme"
        ></button>
        <button
          id="reset"
          title="Reset layout"
          aria-label="Reset layout"
        ></button>
      </div>
    </header>
    <main class="app-main">
      <nav id="activity" class="rail" aria-label="Views">
        <div class="rail-main">
          <button data-view="explorer" title="Files" aria-label="Files">
            ▱
          </button>
          <button data-view="search" title="Search" aria-label="Search">
            ⌕
          </button>
          <button
            hidden
            data-view="source-control"
            title="Source control"
            aria-label="Source control"
          >
            ⑂
          </button>
          <button
            hidden
            data-view="terminal"
            title="Terminal"
            aria-label="Terminal"
          >
            ›_
          </button>
          <button
            hidden
            data-view="context"
            title="Context"
            aria-label="Context"
          >
            ⊞
          </button>
          <button hidden data-view="input" title="Input" aria-label="Input">
            ⌨
          </button>
          <button hidden data-view="output" title="Output" aria-label="Output">
            ≡
          </button>
        </div>
        <button
          hidden
          data-view="connections"
          title="Connections"
          aria-label="Connections"
        >
          ⚙
        </button>
      </nav>
      <div id="workspace" aria-label="Workspace"></div>
    </main>
    <footer class="app-footer">
      <span id="status" role="status">Starting</span
      ><span id="performance"></span
      ><button id="layout-export">Export layout</button
      ><a href="/layout">Layout framework</a><span>VS Code source · MIT</span>
    </footer>
  </body>
</html>
